# docs/site/ is the retired documentation site: redirect stubs only, kept so
# that URLs published before the docs moved into docs/ keep resolving. The
# canonical docs live in docs/ and are not built here.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'

  # Build (but do not deploy) on PRs, so a broken site config is caught before
  # it reaches main -- the deploy path only ever runs post-merge.
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-pages:
    name: Check GitHub Pages Configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check GitHub Pages configuration
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${{ github.repository }}/pages"
          response_file="$RUNNER_TEMP/pages.json"
          status_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api_url")"

          if [ "$status_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status_code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not configured for ${{ github.repository }}; skipping site build and deploy."
          else
            cat "$response_file"
            exit 1
          fi

  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needs pages: write, which fork PRs never get -- and a PR only needs the
      # build to prove the site still compiles.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: docs/site
          destination: ./_site

      - name: Check every page is a redirect
        run: |
          missing=$(grep -RL 'http-equiv="refresh"' ./_site --include='*.html' || true)
          if [ -n "$missing" ]; then
            echo "::error::These built pages are not redirects. docs/site/ is retired -- put the content in docs/ instead:"
            echo "$missing"
            exit 1
          fi
          echo "All $(find ./_site -name '*.html' | wc -l) built pages redirect to docs/."

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
